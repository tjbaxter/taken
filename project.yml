name: Taken

options:
  bundleIdPrefix: com.tombaxter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: F7YRP3B2U8
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # Release signing is manual (.github/workflows/release.yml). Profile names are variables so the
    # release job can pass the names it installed; plain (not sdk-conditional) keys so EAS can rewrite them.
    TAKEN_APP_PROFILE: "Taken App Store"
    TAKEN_WIDGETS_PROFILE: "Taken Widgets App Store"

fileGroups:
  - Taken/Taken.storekit

targets:
  Taken:
    type: application
    platform: iOS
    sources:
      # The StoreKit configuration is for local runs (the scheme's Run action), never part of the app bundle.
      - path: Taken
        excludes:
          - "Taken.storekit"
      - path: Shared
    dependencies:
      - target: TakenWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Taken
        PRODUCT_BUNDLE_IDENTIFIER: com.tombaxter.taken
        # iPhone only. Must sit on the target: XcodeGen's iOS target preset sets "1,2", which overrides
        # the project-level value, and App Store Connect rejected build 5 (universal, portrait only, 90474).
        # Once a universal build is accepted, iPad support can never be dropped.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Taken/Info.plist
        CODE_SIGN_ENTITLEMENTS: Taken/Taken.entitlements
        # Signal's icon is the primary; each other look has its own alternate icon (Taken switches with
        # UIApplication.setAlternateIconName when the look changes). The names match ThemeID.alternateIconName.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blush AppIcon-Phosphor AppIcon-Ice"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(TAKEN_APP_PROFILE)"

  TakenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TakenWidgets
      - path: Shared
      - path: Taken/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TakenWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.tombaxter.taken.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TakenWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TakenWidgets/TakenWidgets.entitlements
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(TAKEN_WIDGETS_PROFILE)"

  TakenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TakenTests
    dependencies:
      - target: Taken
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tombaxter.taken.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Taken:
    build:
      targets:
        Taken: all
        TakenWidgets: all
        TakenTests: [test]
    run:
      config: Debug
      # Simulator runs from Xcode buy Taken Pro against this local configuration: the three products, the
      # "Taken Pro" group (yearly level 1, monthly level 2) and the 1 week introductory offer.
      storeKitConfiguration: "Taken/Taken.storekit"
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TakenTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
