name: Internal TestFlight

# The owner's internal TestFlight build (eas.json profile "internal", .eas/build/build-ios-internal.yml) without an EAS
# cloud build: `eas build --local` runs the internal profile's custom steps unchanged on this macOS runner (the profile
# guard, project.internal.yml, TakenInternalPro, the testFlightInternalTestingOnly export, check-xcode.sh and
# check-app-store-build.sh --internal), so no build is sent to EAS's servers and none counts against the plan's quota
# (https://docs.expo.dev/build-reference/local-builds/, https://docs.expo.dev/billing/faq/). `eas submit` then uploads
# the .ipa to App Store Connect with the key EAS already holds; App Store Connect marks it Internal, so it can only go
# to internal tester groups. Signing uses EAS's managed credentials (--freeze-credentials never changes them) and the
# build number EAS's remote autoIncrement keeps, so no release.yml secret is needed. The App Store build comes from
# app-store-build.yml, never from here.
#
# Run by hand only, and only once the EXPO_TOKEN repository secret exists (an Expo robot user's token,
# https://docs.expo.dev/accounts/programmatic-access/). eas-cli is pinned to 24.11.0, published 2026-10-05: a release at
# least two weeks old, never the newest. The CI gate, the Xcode, and the Node and fastlane of the EAS image come from
# .github/actions/ship-setup, shared with app-store-build.yml. This repository is public, so its Actions logs are too:
# default log levels only (never --verbose-logs), and the token is set on the two eas steps alone and never printed.

on:
  workflow_dispatch:

# One queue with app-store-build.yml. EAS's remote autoIncrement reads the newest build number and then writes the next
# one (resolveRemoteBuildNumberAsync, https://github.com/expo/eas-cli/blob/v24.11.0/packages/eas-cli/src/build/ios/version.ts)
# for the bundle identifier both profiles build, so two builds at once could take the same number, and App Store Connect
# identifies a build by it. queue: max keeps every waiting run in line instead of cancelling all but the newest
# (https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs).
concurrency:
  group: app-store-connect-upload
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  internal:
    name: Build on this runner and submit to TestFlight internal testing
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CI gate, Xcode, Node, fastlane and the Xcode project (.github/actions/ship-setup)
        uses: ./.github/actions/ship-setup

      - name: Build the internal profile on this runner (no EAS cloud build)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Capabilities are set in the Developer portal already; syncing them would need an Apple sign-in.
          EXPO_NO_CAPABILITY_SYNC: "1"
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing repository secret EXPO_TOKEN"
            exit 1
          fi
          test "$(node --version)" = "v22.23.4"
          npx --yes eas-cli@24.11.0 build -p ios -e internal --local --non-interactive --freeze-credentials \
            --output "$RUNNER_TEMP/Taken-internal.ipa"
          test -f "$RUNNER_TEMP/Taken-internal.ipa"

      - name: Submit to TestFlight internal testing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          npx --yes eas-cli@24.11.0 submit -p ios -e internal --path "$RUNNER_TEMP/Taken-internal.ipa" \
            --non-interactive --wait
