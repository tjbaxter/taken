name: Android

# Taken for Android (android/SPEC-ANDROID.md section 15). Everything runs on GitHub's standard ubuntu-24.04 runners: this
# repository is public, and "GitHub Actions usage is free for self-hosted runners and for public repositories that use
# standard GitHub-hosted runners" (https://docs.github.com/en/billing/concepts/product-billing/github-actions). No Mac and
# no emulator: the unit tests run on the JVM, the screens are drawn by Robolectric's native graphics and saved by
# Roborazzi, as Google's Now in Android does on Linux CI (https://github.com/android/nowinandroid/blob/main/.github/workflows/Build.yaml).
#
# Java 21: AGP 9.4 needs 17 or later, and Robolectric 4.17 runs Android 16 (API 36, Taken's targetSdk) only on Java 21
# (its DefaultSdkProvider, https://github.com/robolectric/robolectric/blob/robolectric-4.17/robolectric/src/main/java/org/robolectric/plugins/DefaultSdkProvider.java).

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Core rules and their tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Caches Gradle and validates the committed wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
      - name: Core unit tests (the ported XCTest cases)
        run: ./gradlew :core:test --stacktrace
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: android/core/build/reports/tests/
          retention-days: 7

  app:
    name: App unit tests, lint and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: App unit tests (Robolectric), lint and the debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-report
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7

  screenshots:
    name: Screenshots for Tom
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Record only, for now: once Tom approves a set it is committed as the baseline and this becomes
      # verifyRoborazziDebug (SPEC-ANDROID 15.2).
      - name: Draw every screen (Robolectric + Roborazzi)
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: android-screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/**/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-test-report
          path: android/app/build/reports/tests/
          retention-days: 7

  release:
    name: Release bundle (R8, unsigned) and its checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Release bundle with R8
        run: ./gradlew :app:bundleRelease --stacktrace
      # One line per check (SPEC-ANDROID 3.3 and 15.4). Signing and the Play upload come with android-release.yml.
      - name: Check the bundle
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -f "$aab" && echo "OK   bundle built: $(du -h "$aab" | cut -f1)"
          # 16 KB page sizes: a bundle with no native libraries already supports them
          # (https://developer.android.com/guide/practices/page-sizes).
          if unzip -l "$aab" | grep -E '^ .* base/lib/' >/dev/null; then
            echo "FAIL native libraries in the bundle"; unzip -l "$aab" | grep 'base/lib/'; exit 1
          fi
          echo "OK   no lib/ folder: 16 KB page size compliant"
          if unzip -l "$aab" | grep -q 'DemoScreens'; then echo "FAIL debug-only demo code in release"; exit 1; fi
          manifest="$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -n 1)"
          test -n "$manifest" || { echo "FAIL merged release manifest not found"; exit 1; }
          echo "Merged manifest: $manifest"
          grep -o 'android:targetSdkVersion="[0-9]*"' "$manifest" | grep -q '"36"' && echo "OK   targetSdk 36" || { echo "FAIL targetSdk"; exit 1; }
          grep -o 'android:minSdkVersion="[0-9]*"' "$manifest" | grep -q '"28"' && echo "OK   minSdk 28" || { echo "FAIL minSdk"; exit 1; }
          permissions="$(grep -o '<uses-permission[^>]*android:name="[^"]*"' "$manifest" | sed 's/.*android:name="\([^"]*\)"/\1/' | sort -u)"
          echo "Permissions in the merged manifest:"; echo "${permissions:-  (none)}" | sed 's/^/  /'
          allowed="com.android.vending.BILLING android.permission.POST_NOTIFICATIONS android.permission.RECORD_AUDIO \
            android.permission.RECEIVE_BOOT_COMPLETED android.permission.WAKE_LOCK android.permission.ACCESS_NETWORK_STATE \
            android.permission.FOREGROUND_SERVICE com.tombaxter.taken.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          status=0
          for p in $permissions; do
            case " $allowed " in
              *" $p "*) ;;
              *) echo "FAIL $p is not in SPEC-ANDROID 3.3's list"; status=1 ;;
            esac
          done
          for p in com.google.android.gms.permission.AD_ID android.permission.SCHEDULE_EXACT_ALARM \
                   android.permission.USE_EXACT_ALARM android.permission.INTERNET; do
            if echo "$permissions" | grep -qx "$p"; then echo "FAIL forbidden permission $p"; status=1; fi
          done
          [ "$status" = 0 ] && echo "OK   permissions match SPEC-ANDROID 3.3, nothing forbidden"
          exit "$status"
