name: Release

# Archive, sign (manual), export and upload to App Store Connect for TestFlight.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, DIST_CERT_P12_BASE64, DIST_CERT_PASSWORD,
#          PROFILE_APP_BASE64, PROFILE_WIDGETS_BASE64.
# Optional repository variable ASC_APP_ID: the app's numeric Apple ID, passed to altool as --apple-id.

on:
  workflow_dispatch:
    inputs:
      build_offset:
        description: "Added to the run number to make the build number. Raise it if App Store Connect already has a higher build."
        required: false
        default: "0"
      version:
        description: "Marketing version x.y.z. Leave empty to use the version in project.yml."
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: F7YRP3B2U8
      APP_BUNDLE_ID: com.tombaxter.taken
      WIDGETS_BUNDLE_ID: com.tombaxter.taken.widgets
      APP_GROUP: group.com.tombaxter.taken
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Nothing ships that ci.yml has not passed: the build, the unit tests, and the screenshots with their link checks
      # (taken://todo must bring the To-do tab to the front). The newest green run on main counts when it is this commit
      # or an ancestor, and nothing ci.yml checks (it ignores docs/, brand/ and Markdown) has changed since.
      - name: CI passed for this code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          shas="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 50 \
                    --json headSha --jq '.[].headSha')"
          for sha in $shas; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            git merge-base --is-ancestor "$sha" "$head" || continue
            if git diff --quiet "$sha" "$head" -- . ':(exclude)docs/**' ':(exclude)brand/**' ':(exclude)*.md'; then
              echo "ci.yml passed on $sha, and nothing it checks has changed since"
              exit 0
            fi
          done
          echo "::error::No green ci.yml run on main covers $head (build, unit tests, screenshots and link checks). Let CI pass first."
          exit 1

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD PROFILE_APP_BASE64 PROFILE_WIDGETS_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Version and build number
        id: version
        env:
          OFFSET: ${{ inputs.build_offset }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          offset="${OFFSET:-0}"
          case "$offset" in
            ''|*[!0-9]*) echo "::error::build_offset must be a whole number, got '$offset'"; exit 1 ;;
          esac
          build=$(( RUN_NUMBER + offset ))
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -n 1)"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Version '$version' is not x.y.z"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Taken $version ($build)"

      - name: Founding member cutoff
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A first download of build <= FoundingMember.maxBuild keeps Taken Pro for life (Shared/Pro.swift), so a
          # 1.1+ build numbered inside that range would hand Pro to every new customer.
          set -euo pipefail
          max_build="$(sed -n 's/.*static let maxBuild = \([0-9][0-9]*\).*/\1/p' Shared/Pro.swift | head -n 1)"
          if [ -z "$max_build" ]; then
            echo "::error::FoundingMember.maxBuild not found in Shared/Pro.swift"
            exit 1
          fi
          case "$VERSION" in
            1.0|1.0.*)
              echo "1.0.x build $BUILD_NUMBER. Founding members are first downloads of builds 1 to $max_build."
              ;;
            *)
              if [ "$BUILD_NUMBER" -le "$max_build" ]; then
                echo "::error::Build $BUILD_NUMBER of $VERSION is not above FoundingMember.maxBuild ($max_build). Raise build_offset."
                exit 1
              fi
              echo "Build $BUILD_NUMBER is above the founding cutoff ($max_build)."
              ;;
          esac

      - name: Select Xcode 26
        run: scripts/select-xcode.sh

      - name: Install certificate, profiles and API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
        run: |
          set -euo pipefail

          # Temporary keychain holding only the distribution identity.
          keychain="$RUNNER_TEMP/taken-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          cert="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$cert"
          if ! security import "$cert" -k "$keychain" -P "$DIST_CERT_PASSWORD" -f pkcs12 -t cert -A; then
            rm -f "$cert"
            echo "::error::Could not import the distribution certificate. Check DIST_CERT_PASSWORD. A .p12 exported with OpenSSL 3 needs the -legacy flag."
            exit 1
          fi
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution"; then
            echo "::error::The certificate is not an Apple Distribution identity"
            exit 1
          fi

          # Provisioning profiles: checked, then installed where Xcode 16+ and older tools look.
          install_profile() {
            local encoded="$1" bundle_id="$2" label="$3"
            local file="$RUNNER_TEMP/$label.mobileprovision"
            local plist="$RUNNER_TEMP/$label-profile.plist"
            printf '%s' "$encoded" | base64 --decode > "$file"
            security cms -D -i "$file" > "$plist"
            local uuid name app_id
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            if [ "$app_id" != "$TEAM_ID.$bundle_id" ]; then
              echo "::error::Profile '$name' is for $app_id, expected $TEAM_ID.$bundle_id"
              exit 1
            fi
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" > /dev/null 2>&1; then
              echo "::error::Profile '$name' lists devices, so it is not an App Store profile"
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$plist" 2>/dev/null | grep -q "$APP_GROUP"; then
              echo "::error::Profile '$name' does not include the App Group $APP_GROUP"
              exit 1
            fi
            for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.mobileprovision"
            done
            rm -f "$file" "$plist"
            echo "Installed profile '$name' ($uuid) for $bundle_id"
            PROFILE_NAME="$name"
          }
          install_profile "$PROFILE_APP_BASE64" "$APP_BUNDLE_ID" app
          echo "APP_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          install_profile "$PROFILE_WIDGETS_BASE64" "$WIDGETS_BUNDLE_ID" widgets
          echo "WIDGETS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          # App Store Connect API key, where altool looks for it.
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Taken.xcodeproj \
            -scheme Taken \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Taken.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TAKEN_APP_PROFILE="$APP_PROFILE_NAME" \
            TAKEN_WIDGETS_PROFILE="$WIDGETS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcbeautify --renderer github-actions

      - name: Verify archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Taken.xcarchive/Products/Applications/Taken.app"
          widgets="$app/PlugIns/TakenWidgets.appex"
          for bundle in "$app" "$widgets"; do
            build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Info.plist")"
            short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist")"
            echo "$(basename "$bundle"): $short ($build)"
            [ "$build" = "$BUILD_NUMBER" ] || { echo "::error::$(basename "$bundle") has build $build, expected $BUILD_NUMBER"; exit 1; }
            [ "$short" = "$VERSION" ] || { echo "::error::$(basename "$bundle") has version $short, expected $VERSION"; exit 1; }
            codesign --verify --strict --verbose=2 "$bundle"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | grep -q "$APP_GROUP" \
              || { echo "::error::$(basename "$bundle") is missing the App Group entitlement"; exit 1; }
          done
          # App Review Guideline 2.5.19: nothing owner-only reaches App Store Connect from here.
          scripts/check-app-store-build.sh "$app"

      - name: Export IPA
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$options" export <<'PY'
          import os, plistlib, sys
          with open("ExportOptions.plist", "rb") as f:
              options = plistlib.load(f)
          options["teamID"] = os.environ["TEAM_ID"]
          options["destination"] = sys.argv[2]
          options["provisioningProfiles"] = {
              os.environ["APP_BUNDLE_ID"]: os.environ["APP_PROFILE_NAME"],
              os.environ["WIDGETS_BUNDLE_ID"]: os.environ["WIDGETS_PROFILE_NAME"],
          }
          with open(sys.argv[1], "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Taken.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | xcbeautify --renderer github-actions
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          [ -f "$ipa" ] || { echo "::error::No IPA was exported"; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          set -uo pipefail
          export API_PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          log="$RUNNER_TEMP/altool.log"

          # altool on Xcode 26 can exit 0 on failure, so the output decides.
          if [ -n "${ASC_APP_ID:-}" ]; then
            xcrun altool --upload-app --file "$IPA_PATH" --type ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --apple-id "$ASC_APP_ID" > "$log" 2>&1
          else
            xcrun altool --upload-app --file "$IPA_PATH" --type ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$log" 2>&1
          fi
          status=$?
          cat "$log"
          if [ "$status" -eq 0 ] && ! grep -Eqi 'ERROR ITMS|\*\*\* Error|error:|UPLOAD FAILED|Failed to|Unable to' "$log"; then
            echo "Uploaded with altool."
            exit 0
          fi

          echo "::warning::altool did not confirm the upload (exit $status). Trying xcodebuild -exportArchive with destination upload."
          options="$RUNNER_TEMP/ExportOptions-upload.plist"
          python3 - "$options" upload <<'PY'
          import os, plistlib, sys
          with open("ExportOptions.plist", "rb") as f:
              options = plistlib.load(f)
          options["teamID"] = os.environ["TEAM_ID"]
          options["destination"] = sys.argv[2]
          options["provisioningProfiles"] = {
              os.environ["APP_BUNDLE_ID"]: os.environ["APP_PROFILE_NAME"],
              os.environ["WIDGETS_BUNDLE_ID"]: os.environ["WIDGETS_PROFILE_NAME"],
          }
          with open(sys.argv[1], "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Taken.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log" | xcbeautify --renderer github-actions

      - name: Summary
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Taken $VERSION ($BUILD_NUMBER) sent to App Store Connect"
            echo "Processing takes a few minutes, then the build appears in TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/altool.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*-profile.plist
          echo "Signing material removed."
