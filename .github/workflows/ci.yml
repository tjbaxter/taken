name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "brand/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode (.xcode-version)
        run: scripts/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          udid="$(scripts/pick-simulator.sh "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Taken.xcodeproj \
            -scheme Taken \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TakenTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-test.log | xcbeautify --renderer github-actions

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: |
            build/xcodebuild-test.log
            build/TakenTests.xcresult
          retention-days: 7

  device-build:
    name: Release build for device (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Internal builds export "TestFlight internal testing only" from their own EAS config; it must keep every check
      # the App Store config has.
      - name: Check the EAS configs
        run: scripts/check-eas-configs.sh

      - name: Select Xcode (.xcode-version)
        run: scripts/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Release for generic iOS
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Taken.xcodeproj \
            -scheme Taken \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-release.log | xcbeautify --renderer github-actions

      - name: Check the built bundles
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/Taken.app"
          appex="$app/PlugIns/TakenWidgets.appex"
          test -d "$appex"
          # App Review Guideline 2.5.19: the App Store shape has no owner-only Pro unlock, eval sheet or marker.
          scripts/check-app-store-build.sh "$app"
          # Built by the Xcode in .xcode-version, the one EAS ships with (EAS runs the same check on its .ipa).
          scripts/check-xcode.sh "$app"
          scripts/check-xcode.sh "$appex"
          for bundle in "$app" "$appex"; do
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Info.plist"
            test -f "$bundle/PrivacyInfo.xcprivacy"
            test -f "$bundle/GeistMono-Medium.ttf"
          done
          # iPhone only (SPEC 2): UIDeviceFamily must be exactly [1]. A universal build was rejected once
          # (90474), and once a universal build is accepted iPad support can never be withdrawn.
          for bundle in "$app" "$appex"; do
            families="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$bundle/Info.plist" 2>/dev/null | grep -Eo '[0-9]+' | tr '\n' ' ' || true)"
            echo "UIDeviceFamily $(basename "$bundle"): ${families:-missing}"
            if [ -z "$families" ] && [ "$bundle" = "$appex" ]; then
              echo "::notice::$(basename "$bundle") has no UIDeviceFamily key; the app's governs"
              continue
            fi
            if [ "$families" != "1 " ]; then
              echo "::error::$(basename "$bundle") UIDeviceFamily is '${families:-missing}', expected only 1 (iPhone)"
              exit 1
            fi
          done
          test -f "$app/Metadata.appintents/extract.actionsdata" && echo "App Intents metadata present"
          # Voice to-dos (SPEC 3.10): Foundation Models exists only on iOS 26, so it must be weak-linked or iOS 17 to 25
          # would fail to launch.
          loads="$(otool -l "$app/Taken")"
          if grep -q "FoundationModels.framework" <<<"$loads"; then
            linked="$(grep -B2 "FoundationModels.framework" <<<"$loads")"
            echo "$linked"
            if grep -q "LC_LOAD_WEAK_DYLIB" <<<"$linked"; then
              echo "FoundationModels is weak-linked"
            else
              echo "::error::FoundationModels is strongly linked; iOS 17 to 25 would not launch"
              exit 1
            fi
          else
            echo "FoundationModels is not linked"
          fi
          for key in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription UIApplicationShortcutItems; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" >/dev/null || { echo "::error::$key missing"; exit 1; }
          done
          # The looks (SPEC 4): Signal is the primary icon, every other look ships an alternate icon, and the app is no
          # longer forced dark (Blush is light; each look sets its own colour scheme).
          for icon in AppIcon-Blush AppIcon-Phosphor AppIcon-Ice; do
            if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:$icon" "$app/Info.plist"; then
              echo "::error::Alternate icon $icon is missing from CFBundleIcons"
              exit 1
            fi
          done
          style="$(/usr/libexec/PlistBuddy -c 'Print :UIUserInterfaceStyle' "$app/Info.plist" 2>/dev/null || echo unset)"
          echo "UIUserInterfaceStyle: $style"
          if [ "$style" = "Dark" ] || [ "$style" = "Light" ]; then
            echo "::error::UIUserInterfaceStyle forces $style; the looks need Automatic"
            exit 1
          fi
          ls "$app" | head -50

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-log
          path: build/xcodebuild-release.log
          retention-days: 7

  screenshots:
    name: Screenshots
    runs-on: macos-26
    # 37 to 48 minutes with To-do v2's list, cap and type screens in every look; v3 drops the list and type screens,
    # and runner speed varies.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode (.xcode-version)
        run: scripts/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          udid="$(scripts/pick-simulator.sh "iPhone 17 Pro Max" "iPhone 16 Pro Max")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
          small="$(scripts/pick-simulator.sh "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro")"
          echo "small=$small" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$small"

      - name: Build app for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Taken.xcodeproj \
            -scheme Taken \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-build.log | xcbeautify --renderer github-actions

      - name: Capture screenshots
        run: scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/DerivedData/Build/Products/Debug-iphonesimulator/Taken.app screenshots build/screenshot-diagnostics "${{ steps.sim.outputs.small }}"

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload screenshot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diagnostics
          path: build/screenshot-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build/xcodebuild-build.log
          retention-days: 7
